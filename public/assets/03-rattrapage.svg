<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Diagnostic et rattrapage d'une mayonnaise tranchée</title>
<desc>Trois causes possibles à une mayonnaise tranchée : huile versée trop vite, ingrédients de températures différentes, ou trop d'huile pour un seul jaune. Dans les trois cas, le rattrapage est le même : repartir d'une base neuve et réincorporer goutte à goutte.</desc>
<style>
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#3D3B36}
  .ttl{font-size:14px;font-weight:600}
  .hd{font-size:12px;font-weight:600}
  .ts{font-size:11px;fill:#6F6C63}
  .box{fill:#ECEAE3;stroke:#CFCBC0;stroke-width:.8}
  .alert{fill:#F6DCCF;stroke:#DCA888;stroke-width:.8}
  .fix{fill:#FFFFFF;stroke:#9A978E;stroke-width:1.2}
  .link{stroke:#B8B5AC;stroke-width:.9;stroke-dasharray:3 2;fill:none}
</style>

<text class="ttl" x="20" y="26">Elle a tranché : trois causes, un seul remède</text>

<rect class="alert" x="230" y="44" width="220" height="34" rx="6"/>
<text class="hd" x="340" y="66" text-anchor="middle">Les gouttelettes se sont rejointes</text>

<line class="link" x1="340" y1="78" x2="340" y2="94"/>
<line class="link" x1="118" y1="94" x2="562" y2="94"/>
<line class="link" x1="118" y1="94" x2="118" y2="112"/>
<line class="link" x1="340" y1="94" x2="340" y2="112"/>
<line class="link" x1="562" y1="94" x2="562" y2="112"/>

<rect class="box" x="28" y="112" width="180" height="66" rx="6"/>
<text class="hd" x="118" y="136" text-anchor="middle">Trop vite</text>
<text class="ts" x="118" y="156" text-anchor="middle">l'huile a été versée</text>
<text class="ts" x="118" y="170" text-anchor="middle">en filet dès le départ</text>

<rect class="box" x="250" y="112" width="180" height="66" rx="6"/>
<text class="hd" x="340" y="136" text-anchor="middle">Trop froid</text>
<text class="ts" x="340" y="156" text-anchor="middle">les ingrédients n'étaient pas</text>
<text class="ts" x="340" y="170" text-anchor="middle">à la même température</text>

<rect class="box" x="472" y="112" width="180" height="66" rx="6"/>
<text class="hd" x="562" y="136" text-anchor="middle">Trop d'huile</text>
<text class="ts" x="562" y="156" text-anchor="middle">au-delà de 25 cl</text>
<text class="ts" x="562" y="170" text-anchor="middle">pour un seul jaune</text>

<line class="link" x1="118" y1="178" x2="118" y2="196"/>
<line class="link" x1="340" y1="178" x2="340" y2="196"/>
<line class="link" x1="562" y1="178" x2="562" y2="196"/>
<line class="link" x1="118" y1="196" x2="562" y2="196"/>
<line class="link" x1="340" y1="196" x2="340" y2="212"/>

<rect class="fix" x="90" y="212" width="500" height="66" rx="6"/>
<text class="hd" x="340" y="236" text-anchor="middle">Le rattrapage, identique dans les trois cas</text>
<text class="ts" x="340" y="256" text-anchor="middle">Un bol propre, un jaune neuf ou une cuillère de moutarde,</text>
<text class="ts" x="340" y="270" text-anchor="middle">puis on réincorpore la ratée goutte à goutte, comme si c'était de l'huile.</text>
</svg>
